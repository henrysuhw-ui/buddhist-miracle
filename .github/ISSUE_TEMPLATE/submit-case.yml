name: 投稿感應記事
description: 提供一則已公開發表的現代佛教感應記事。只收公開連結，不收私人經歷。
title: "[投稿] "
labels: ["submission"]
body:
  - type: markdown
    attributes:
      value: |
        本錄只輯**已公開發表**的資料，說話者須為當事人本人。
        聽來的、長輩轉述、法師講信眾故事，以及未公開的私人經歷，一概不收。
        不必寫得漂亮，把公開連結講清楚就好。

  - type: input
    id: source-url
    attributes:
      label: 公開連結
      description: 影片、文章、帖文、報刊的網址；若為書籍，請填書名與頁碼。
      placeholder: https://youtu.be/xxxx 或《書名》頁 88
    validations:
      required: true

  - type: input
    id: locator
    attributes:
      label: 時間戳或頁碼
      description: 影片請給時間點；文章請說明段落位置；書請給頁碼。
      placeholder: "12:34"
    validations:
      required: true

  - type: textarea
    id: note
    attributes:
      label: 事情大概
      description: 三五句即可。何時、何地、何人、發生什麼、當事人自己怎樣理解。
      placeholder: |
        二〇二三年十一月，香港，五十餘歲，乳癌第三期。
        術前一夜念佛至睡着，夢見白衣人立在床邊。
        她認為是觀音菩薩示現。
    validations:
      required: true

  - type: checkboxes
    id: confirm
    attributes:
      label: 確認
      options:
        - label: 連結公開可開，說話者是當事人本人，或當事人口述而已公開發表的記錄
          required: true
        - label: 這不是私人提供的經歷、私信、未刊手稿或群組截圖
          required: true
        - label: 我理解本錄只寫摘要並附出處，不轉載全文
          required: true
