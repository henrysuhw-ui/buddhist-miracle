name: 投稿感應記事
description: 提供一則已公開發表的現代佛教感應記事。只收公開連結，不收私人經歷。
title: "[投稿] "
labels: ["submission"]
body:
  - type: markdown
    attributes:
      value: |
        本錄只輯**已公開發表**的資料，說話者須為當事人本人。
        聽來的、長輩轉述、法師講信眾故事，一律不收；未公開的私人經歷亦不收。
        詳見 [編例](https://github.com/OWNER/buddhist-miracle/blob/main/docs/EDITORIAL.md)。
        不必寫得漂亮，把公開連結講清楚就好。

  - type: input
    id: source-url
    attributes:
      label: 公開的原始連結
      description: 影片、文章、帖文、報刊的網址。若為書籍，請填書名、作者、出版社、頁碼。
      placeholder: https://youtu.be/xxxx 或《書名》頁 88
    validations:
      required: true

  - type: input
    id: locator
    attributes:
      label: 時間戳或頁碼
      description: 影片請給時間點（例如 12:34）；文章請說明段落位置；書請給頁碼。
      placeholder: "12:34"
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: 事情大概
      description: 三五句即可。何時、何地、何人、發生什麼、當事人自己怎樣理解。
      placeholder: |
        二〇二三年十一月，香港，五十餘歲，乳癌第三期。
        術前一夜念佛至睡着，夢見白衣人立在床邊。
        她認為是觀音菩薩示現。
    validations:
      required: true

  - type: dropdown
    id: relationship
    attributes:
      label: 你與這則資料的關係
      options:
        - 我自行搜尋找到
        - 我在討論區／社群看到有人轉貼
        - 我是記錄者或發表平台
      validations:
        required: true

  - type: checkboxes
    id: confirm
    attributes:
      label: 確認
      options:
        - label: 這個連結是公開的，任何人都能開啟
          required: true
        - label: 說話的人是當事人本人，或當事人口述而他人記錄並已公開發表
          required: true
        - label: 這不是私人提供的經歷、私信、未刊手稿或群組截圖
          required: true
        - label: 我理解本錄只寫摘要並附出處，不轉載全文
          required: true
        - label: 我理解當事人要求下架時，條目會無條件移除
          required: true
